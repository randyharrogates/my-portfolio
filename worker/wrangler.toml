name = "portfolio-fit"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://randyharrogates.github.io"
AGENT_ENABLED = "false"          # the kill switch: "true" turns live runs on
ENVIRONMENT = "production"
OPENAI_MODEL = "gpt-6-luna"
# "low" keeps hidden reasoning small. Left unset, it sometimes used up a step's whole output cap and the reply was cut off.
OPENAI_REASONING_EFFORT = "low"
PRICE_INPUT_PER_M = "0.10"       # USD per million tokens: confirm on OpenAI's pricing page
PRICE_CACHED_PER_M = "0.01"
PRICE_OUTPUT_PER_M = "0.50"
MONTHLY_BUDGET_USD = "10"
DAILY_BUDGET_USD = "0.33"
RUNS_PER_DAY = "5"
QUESTIONS_PER_DAY = "10"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 20 requests per 10 seconds per IP, across every route
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 20, period = 10 }

# Local development: `npx wrangler dev --env dev` with secrets in .dev.vars
[env.dev]
[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:8765"
AGENT_ENABLED = "true"
ENVIRONMENT = "dev"
OPENAI_MODEL = "gpt-6-luna"
# "low" keeps hidden reasoning small. Left unset, it sometimes used up a step's whole output cap and the reply was cut off.
OPENAI_REASONING_EFFORT = "low"
PRICE_INPUT_PER_M = "0.10"
PRICE_CACHED_PER_M = "0.01"
PRICE_OUTPUT_PER_M = "0.50"
MONTHLY_BUDGET_USD = "1"
DAILY_BUDGET_USD = "0.25"
RUNS_PER_DAY = "5"
QUESTIONS_PER_DAY = "10"

[[env.dev.durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "dev-local"

[[env.dev.ratelimits]]
name = "BURST"
namespace_id = "1002"
simple = { limit = 20, period = 10 }
